# https://mise.jdx.dev/configuration.html
[tools]
node = "24.22.0"
bun = "1.4.3"
pnpm = "12.14.0"
uv = "0.13.1"
"op" = "2.41.0"
rust = { version = "1.99.1", components = ["rust-analyzer"] }
ruby = "4.0.7"
go = "1.27.2"
"npm:typescript-language-server" = "6.0.2"
"npm:@devcontainers/cli" = "0.89.0"
"npm:@antfu/ni" = "30.6.0"
# Brewfile のフォーマット用
"gem:rufo" = "0.18.2"
# mise の zsh 補完用
usage = "7.0.1"

[bootstrap.packages]
# Apple Brooklyn event inspired screen saver for Apple Silicon https://github.com/nozomiishii/Brooklyn
"brew-cask:nozomiishii/tap/brooklyn" = { os = "macos" }

[settings]
auto_update = true

# precompiled のみ使う。ソースビルドしないので openssl / libyaml が不要
[settings.ruby]
compile = false
