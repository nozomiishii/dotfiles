# https://mise.jdx.dev/configuration.html
[tools]
node = "24.19.0"
bun = "1.3.14"
pnpm = "11.22.0"
uv = "0.12.5"
rust = { version = "1.97.1", components = ["rust-analyzer"] }
ruby = "4.0.6"
"npm:typescript-language-server" = "5.3.0"
"npm:@devcontainers/cli" = "0.88.0"
"npm:@antfu/ni" = "30.5.0"
# Brewfile のフォーマット用
"gem:rufo" = "0.18.2"
# mise の zsh 補完用
usage = "5.1.0"

# precompiled のみ使う。ソースビルドしないので openssl / libyaml が不要
[settings.ruby]
compile = false
