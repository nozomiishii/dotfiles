# https://mise.jdx.dev/configuration.html
[tools]
node = "24.20.0"
bun = "1.4.0"
pnpm = "11.24.0"
uv = "0.12.7"
"op" = "2.39.0"
rust = { version = "1.98.0", components = ["rust-analyzer"] }
ruby = "4.0.6"
go = "1.27.0"
"npm:typescript-language-server" = "6.0.0"
"npm:@devcontainers/cli" = "0.88.0"
"npm:@antfu/ni" = "30.5.0"
# Brewfile のフォーマット用
"gem:rufo" = "0.18.2"
# mise の zsh 補完用
usage = "6.4.1"

[settings]
auto_update = true

# precompiled のみ使う。ソースビルドしないので openssl / libyaml が不要
[settings.ruby]
compile = false
