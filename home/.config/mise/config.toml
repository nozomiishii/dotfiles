# https://mise.jdx.dev/configuration.html
[tools]
node = "26.13.1"
bun = "1.4.5"
pnpm = "12.20.0"
uv = "0.13.8"
"op" = "2.42.0"
rust = { version = "1.100.0", components = ["rust-analyzer"] }
ruby = "4.0.9"
go = "1.27.4"
"npm:typescript-language-server" = "6.0.3"
"npm:@devcontainers/cli" = "0.90.0"
"npm:@antfu/ni" = "30.6.0"
# Brewfile のフォーマット用
"gem:rufo" = "0.18.2"
# mise の zsh 補完用
usage = "7.3.0"

[bootstrap.packages]
# Apple Brooklyn event inspired screen saver for Apple Silicon https://github.com/nozomiishii/Brooklyn
"brew-cask:nozomiishii/tap/brooklyn" = { os = "macos" }

[settings]
auto_update = true

# precompiled のみ使う。ソースビルドしないので openssl / libyaml が不要
[settings.ruby]
compile = false
