# https://mise.jdx.dev/configuration.html
[tools]
node = "24.20.0"
bun = "1.4.0"
pnpm = "11.25.0"
uv = "0.12.9"
"op" = "2.39.0"
rust = { version = "1.98.0", components = ["rust-analyzer"] }
ruby = "4.0.6"
go = "1.27.0"
"npm:typescript-language-server" = "6.0.0"
"npm:@devcontainers/cli" = "0.89.0"
"npm:@antfu/ni" = "30.5.0"
# Brewfile のフォーマット用
"gem:rufo" = "0.18.2"
# mise の zsh 補完用
usage = "6.6.1"

[bootstrap.packages]
# Apple Brooklyn event inspired screen saver for Apple Silicon https://github.com/nozomiishii/Brooklyn
"brew-cask:nozomiishii/tap/brooklyn" = { os = "macos" }

[settings]
auto_update = true

# precompiled のみ使う。ソースビルドしないので openssl / libyaml が不要
[settings.ruby]
compile = false
