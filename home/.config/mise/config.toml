# https://mise.jdx.dev/configuration.html
[tools]
# per-repo の node は devEngines.runtime、pnpm の版は pnpm 自身が packageManager を読んで切替
node = "24.19.0"
bun = "1.3.14"
pnpm = "11.21.0"
uv = "0.12.5"
# rustup を内部で使い、既存の ~/.rustup と ~/.cargo をそのまま再利用する
rust = { version = "1.97.1", components = ["rust-analyzer"] }
"npm:typescript-language-server" = "5.3.0"
"npm:@devcontainers/cli" = "0.88.0"
"npm:@antfu/ni" = "30.5.0"
