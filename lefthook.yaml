# @see
# https://github.com/evilmartians/lefthook
#
# Run the command to test:
#   pnpx lefthook run [-v,--verbose] <hook-name>
#
# Examples:
#   pnpx lefthook run --verbose pre-commit
#   pnpx lefthook run --verbose commit-msg
#   pnpx lefthook run --verbose post-merge
#   pnpx lefthook run --verbose pre-push
extends:
  - ./node_modules/@nozomiishii/lefthook-config/recommended.yaml

post-merge:
  parallel: true
  # post-merge does not auto-populate changed files, so glob alone won't filter.
  # Feed the merge diff to jobs so their glob can actually skip when unrelated.
  files: git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD
  jobs:
    - name: symlink
      glob: "home/**"
      # Only re-link when a path is added or removed under home/. Edits to
      # existing files don't need re-linking — the symlink already points at
      # them. Deletions still trigger mise run link so the apply can clean up
      # the dangling symlink from its recorded state.
      files: git diff-tree -r --name-only --no-commit-id --diff-filter=AD ORIG_HEAD HEAD
      run: MISE_TASK_RUN_AUTO_INSTALL=0 mise run link
    - name: homebrew
      glob: "{Brewfile,home/.config/mise/config.toml}"
      interactive: true
      # homebrew → packages の直列。理由は
      # docs/decisions/brooklyn は Brewfile ではなく mise bootstrap.packages で管理する.md
      run: MISE_TASK_RUN_AUTO_INSTALL=0 mise run homebrew && MISE_TASK_RUN_AUTO_INSTALL=0 mise run packages
    # recommended.yaml の update-node-modules と並列実行すると pnpm install が衝突するため、
    # piped group で pnpm install → skills の順に直列化する
    - name: update-node-modules
      skip: true
      run: "true"
    - name: node-and-skills
      group:
        piped: true
        jobs:
          - name: install-dependencies
            glob: "**/{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}"
            run: pnpm install --frozen-lockfile
          - name: skills
            glob: "home/skills-lock.json"
            run: MISE_TASK_RUN_AUTO_INSTALL=0 mise run skills

pre-push:
  parallel: true
  jobs:
    - name: check-pr-not-merged
      run: bash scripts/check-pr-not-merged.sh

pre-commit:
  parallel: true
  jobs:
    - name: readme-sync-check
      glob: "{README.md,README.ja.md}"
      run: git diff --cached --name-only | bash scripts/check-readme-sync.sh
