name: recommended

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  recommended:
    permissions:
      contents: read # required by actions/checkout
      pull-requests: write # write: format revert PR titles, read: validate PR titles / list PR files (dorny/paths-filter)
      actions: read # required by zizmor persona audits and referenced_workflows resolution
    uses: nozomiishii/workflows/.github/workflows/recommended.yaml@5aac9ba33c5d12bb33b38d716327e42906f0a63c # v4.0.0
