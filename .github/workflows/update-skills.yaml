name: Update agent skills

on:
  schedule:
    - cron: "17 16 * * 0"
  workflow_dispatch:

concurrency:
  group: update-agent-skills
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write # create the update branch and commit the lockfile
      pull-requests: write # open the update PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Update the skills lockfile
        run: mise run skills-update

      - name: Open or refresh the update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=chore/update-agent-skills
          pr=$(gh pr list --base "$GITHUB_REF_NAME" --head "$branch" --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if git diff --quiet -- external-skills/skills-lock.json; then
            if [[ -n "$pr" ]]; then gh pr close "$pr"; fi
            exit 0
          fi

          title="chore: update agent skills"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --only -m "$title" -- external-skills/skills-lock.json
          if ! git diff --quiet "origin/$branch" HEAD 2>/dev/null; then
            gh auth setup-git
            git push --force-with-lease origin "HEAD:refs/heads/$branch"
          fi
          if [[ -z "$pr" ]]; then
            gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" \
              --body '外部スキルの更新を skills-lock.json に反映しました。'
          fi
