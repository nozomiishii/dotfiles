name: Cloud Setup

on:
  push:
    branches:
      - main
    paths:
      - "home/.agents/**"
      - "home/.claude/**"
      - "home/AGENTS.md"
      - "home/skills-lock.json"
      - "mise.toml"
      - "scripts/cloud/**"
      - ".github/workflows/cloud-setup.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # required by actions/checkout to fetch repository code
      pages: write # required by actions/deploy-pages to publish to GitHub Pages
      id-token: write # required by actions/deploy-pages for OIDC-based deployment verification
    environment:
      name: github-pages
    steps:
      - name: Get code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      # git に無い yomiyasu を lock から戻してから tarball に含める
      - name: Install skills
        run: cd home && skills install --frozen-lockfile

      # cloud-setup tarball を作成して _site/ に配置
      - name: Build tarball
        run: |
          mkdir _site
          tar czf _site/cloud-setup.tar.gz \
            home/AGENTS.md \
            home/.claude/settings.json \
            home/.agents/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
