name: Cloud Setup

on:
  push:
    branches:
      - main
    paths:
      - "home/.agents/**"
      - "home/.claude/**"
      - "home/AGENTS.md"
      - "skills-lock.json"
      - "mise.toml"
      - "mise.lock"
      - "scripts/install-skills.sh"
      - "scripts/cloud/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # required by actions/checkout to fetch repository code
      pages: write # required by actions/deploy-pages to publish to GitHub Pages
      id-token: write # required by actions/deploy-pages for OIDC-based deployment verification
    environment:
      name: github-pages
    steps:
      - name: Get code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install skill dependencies
        run: mise run skills

      - name: Build tarball
        run: |
          mkdir -p _site bundle/home/.agents/skills
          cp -RH home/.agents/skills/* bundle/home/.agents/skills/
          tar czf _site/cloud-setup.tar.gz \
            home/AGENTS.md \
            home/.claude/settings.json \
            -C bundle home/.agents/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
